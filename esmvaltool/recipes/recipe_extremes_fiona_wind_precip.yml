# ESMValTool
# recipe_extremes_wind_fiona.yml
---
documentation:

  title: 2022 Atlantic Canada storm

  description: This is a recipe for analysing 2022 Atlantic Canada storm Fiona. 

  authors:
    - malinina_elizaveta

preprocessors:
  preproc_cmip_nat: &preproc_cmip_nat 
    custom_order: True
    extract_season:
      season: JJASON
    extract_shape:
      shapefile: atlantic_canada_no_labrador.shp
      method: contains
      crop: True
    area_statistics:
      operator: max
    annual_statistics:
      operator: max
    anomalies:
      period: full
      reference:
        start_year: 1950
        start_month: 1
        start_day: 1
        end_year: 1969
        end_month: 12
        end_day: 31

  preproc_cmip_all: 
    <<: *preproc_cmip_nat
    extract_time:
      start_year: 2011
      start_month: 1
      start_day: 1
      end_year: 2030
      end_month: 12
      end_day: 31

  preproc_cmip_fut: 
    <<: *preproc_cmip_nat
    extract_time:
      start_year: 2031
      start_month: 1
      start_day: 1
      end_year: 2050
      end_month: 12
      end_day: 31

  preproc_era_abs: &prep_era_abs
    custom_order: True
    extract_season:
      season: JJASON
    extract_shape:
      shapefile: atlantic_canada_no_labrador.shp
      method: contains
      crop: True
    area_statistics:
      operator: max
    annual_statistics:
      operator: max

  preproc_era_ano: 
    <<: *prep_era_abs       
    anomalies:
      period: full
      reference:
        start_year: 1950
        start_month: 1
        start_day: 1
        end_year: 1969
        end_month: 12
        end_day: 31

  preproc_era_gsat:
    custom_order: True  
    area_statistics:
      operator: mean    
    annual_statistics:
      operator: mean
    anomalies:
      period: full
      reference:
        start_year: 1950
        start_month: 1
        start_day: 1
        end_year: 1969
        end_month: 12
        end_day: 31

datasets_highresmip: &datasets_highresmip
  # - {dataset: FGOALS-f3-H, ensemble: r1i1p1f1, grid: gr} # res 0.25d #cmor time frequency
  - {dataset: CMCC-CM2-VHR4, ensemble: r1i1p1f1, grid: gn} # res 0.25d +
  - {dataset: CNRM-CM6-1-HR, ensemble: r(1:10)i1p1f2, grid: gr} # res 0.25d +
  - {dataset: EC-Earth3P-HR, ensemble: r(2:3)i1p1f1, grid: gr} # res 40km +
  - {dataset: NICAM16-7S, ensemble: r1i1p1f1, grid: gr} # res 56km +
  - {dataset: NICAM16-8S, ensemble: r1i1p1f1, grid: gr} # res 28km +
  - {dataset: HadGEM3-GC31-HM, ensemble: "r1i(1:3)p1f1", grid: gn} # res 0.23° × 0.35° + 2022 pr 1 hdf error
  - {dataset: HiRAM-SIT-LR, ensemble: r1i1p1f1, grid: gn} # res 50 km +
  - {dataset: HiRAM-SIT-HR, ensemble: r1i1p1f1, grid: gn} # res 25 km +
  - {dataset: MPI-ESM1-2-XR, ensemble: r1i1p1f1, grid: gn} # res 0.47° × 0.47° +
  - {dataset: MRI-AGCM3-2-H, ensemble: r1i1p1f1, grid: gn} # res 0.19° × 0.19° +
  - {dataset: MRI-AGCM3-2-S, ensemble: r1i1p1f1, grid: gn} # res 0.56° × 0.56° +
  - {dataset: GFDL-CM4C192, ensemble: r1i1p1f1, grid: gr3} #  res 0.56 +

dataset_era: &dataset_era
  - {dataset: ERA5, project: OBS6, type: reanaly, tier: 3}

diagnostics:
  wind:
    description: Figure for NA wind storms
    variables:
      wind_now:
        short_name: sfcWind
        exp: [highresSST-present, highresSST-future]
        start_year: 1950
        end_year: 2030
        project: CMIP6
        mip: day
        preprocessor: preproc_cmip_all
        additional_datasets: *datasets_highresmip      
      wind_nat: 
        short_name: sfcWind
        exp: highresSST-present
        start_year: 1950
        end_year: 1969
        project: CMIP6
        mip: day
        preprocessor: preproc_cmip_nat
        additional_datasets: *datasets_highresmip
      wind_fut: 
        short_name: sfcWind
        exp: [highresSST-present, highresSST-future]
        start_year: 1950
        end_year: 2050
        project: CMIP6
        mip: day
        preprocessor: preproc_cmip_fut
        additional_datasets: *datasets_highresmip
      obs_gsat:
        short_name: tas
        start_year: 1940
        end_year: 2022
        mip: Amon
        version: '1'
        preprocessor: preproc_era_gsat 
        additional_datasets: *dataset_era       
    scripts:
      attr_analysis:
        script: extreme_events/extremes_wind_day.py
        mpl_style: ipcc_ar6_fgd
        reference_period: [1950, 1969]
        era_year_span: [1940, 2022]
        era_regridding_shape: true # determines if needs shapefile or region
        era_regridding_region: atlantic_canada_no_labrador.shp # region to extract from era, either rectang coords or shape file name
        model_weighting: False # determines, if each realisation gets a weight of 1 (false) or 1/number of relisation
        name_wind_now: 2011-2030 # this is needed for legend, it's name_{name of a group}
        name_wind_nat: 1950-1969 
        name_wind_fut: 2031-2050
        region: Atlantic Canada # needed for the figure title
        season: JJASON
        ax_var_label: windspeed # needed for axis name
        title_var_label: Wind speed # needed for title name
        var_units: m/s 
        analysis_year: 2022
        smooth_gsat_years: 4

