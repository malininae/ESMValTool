documentation:
  title: Analysis of ERA5 maximum temeratures.
  description: First analysis step in the Canadian extreme event attribution system
    prototype developped in Climate Research Division (CRD), Environment and Climate
    Change Canada (ECCC).
  authors:
  - malinina_elizaveta

preprocessors:  
  preproc_regions:
    custom_order: true
    extract_shape:
      shapefile: Stone_regions_WRAF05_v4_1_Canada.shp
      method: contains
      crop: true
      ids:
        ID:
          # - Kivalliq
          # - N.Quebec
          # - Ft.Smith
          # - Inuvik
          # - Kitikmeot
          # - Yukon
          - Atl.Canada
      decomposed: true
    extract_time:
        start_year: 2024
        start_month: 5
        start_day: 1
        end_year: 2024
        end_month: 7
        end_day: 5
    area_statistics:
      operator: mean
    convert_units:
      units: degrees_C

datasets:
- dataset: ERA5
  project: OBS6
  type: reanaly
  version: v1
  tier: 3

diagnostics:
  heatwave:
    description: Analysing if the day is a heatwave for each subregion, calculating
      heatwave duration for subregions if appropriate.
    variables:
      current:
        short_name: tasmax
        start_year: 2024
        start_month: 5
        start_day: 1
        end_year: 2024
        end_month: 7
        end_day: 5
        mip: day
        preprocessor: preproc_regions
    scripts:
      heatwave:
        script: extreme_events/heatwave_detection_fr.py
        mpl_style: ipcc_ar6_fgd
        reference_period:
        - 1991
        - 2020
        region: Canada
        var_label: $T_{max}$
        trigger_percentile: 90
        var_units: C
        last_day: false
        half_window: 15
        analysis_day: '2024-07-03'