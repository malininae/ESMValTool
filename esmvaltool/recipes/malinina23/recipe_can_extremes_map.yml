dataset_era: &dataset_era
  - {dataset: ERA5, project: OBS6, type: reanaly, version: v1, tier: 3}

diagnostics:
  analytics:
    description: Figure for BC extremes
    variables:
      txx_all:
        short_name: tasmax
        exp: [historical, ssp245]
        start_year: 1940
        end_year: 2022
        mip: day
        project: CMIP6
        preprocessor: preproc_txx_map
        additional_datasets: *datasets_cmip
      obs:
        short_name: tasmax
        start_year: 1940
        end_year: 2022
        mip: day
        preprocessor: preproc_txx_map 
        # preprocessor: preproc_era 
        additional_datasets: *dataset_era     
    scripts:
      analytics:
        script: extreme_events/extreme_temperature_map.py
        mpl_style: ipcc_ar6_fgd
        cbar_label: standard deviation
        cbar_units: C
        cbar_positive: True
        ratio: True
        title_var_label: Standard deviation in TXx anomalies

