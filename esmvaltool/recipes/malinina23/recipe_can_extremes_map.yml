# ESMValTool
# recipe_bc_extremes_txx.yml
---
documentation:

  title: GEVs 2021 BC heatwave

  description: This is a recipe for analysing 2021 BC heat wave.

  authors:
    - malinina_elizaveta

preprocessors:
  preproc_txx_map:
    custom_order: True
    regrid:
      target_grid: 0.5x0.5
      lon_offset: 0.25
      lat_offset: 0.25
      scheme: linear
    extract_region:
      start_longitude: 210
      end_longitude: 335
      start_latitude: 35
      end_latitude: 80     
    annual_statistics:
      operator: max
    anomalies:
      period: full
      reference:
        start_year: 1940
        start_month: 1
        start_day: 1
        end_year: 1959
        end_month: 12
        end_day: 31
    climate_statistics: 
      operator: std_dev
      period: full 

  preproc_era:
    custom_order: True
    extract_region:
      start_longitude: 210
      end_longitude: 335
      start_latitude: 35
      end_latitude: 80     
    annual_statistics:
      operator: max
    anomalies:
      period: full
      reference:
        start_year: 1940
        start_month: 1
        start_day: 1
        end_year: 1959
        end_month: 12
        end_day: 31
    climate_statistics: 
      operator: std_dev
      period: full  

