# ESMValTool
# recipe_bc_extremes_rectang.yml
---
documentation:
  description: This is a recipe for analysing 2021 BC heat wave.

  authors:
    - malinina_elizaveta

preprocessors:
  preproc_max:
    custom_order: True
    annual_statistics:
      operator: max
    regrid:
      target_grid: 1.875x1.25
      lat_offset: 0.9375
      lon_offset: 0.625
      scheme: linear
    extract_region:
      start_longitude: -123.0
      end_longitude: -119.0
      start_latitude: 45.0
      end_latitude: 52.0
    anomalies:
      period: full
      reference:
        start_year: 1950
        start_month: 1
        start_day: 1
        end_year: 1979
        end_month: 12
        end_day: 31
    extract_time:
      start_year: 1991
      start_month: 1
      start_day: 1
      end_year: 2020
      end_month: 12
      end_day: 31
    area_statistics:
      operator: mean

  preproc_max_future:
    custom_order: True
    annual_statistics:
      operator: max
    regrid:
      target_grid: 1.875x1.25
      lat_offset: 0.9375
      lon_offset: 0.625
      scheme: linear
    extract_region:
      start_longitude: -123.0
      end_longitude: -119.0
      start_latitude: 45.0
      end_latitude: 52.0
    anomalies:
      period: full
      reference:
        start_year: 1950
        start_month: 1
        start_day: 1
        end_year: 1979
        end_month: 12
        end_day: 31
    extract_time:
      start_year: 2071
      start_month: 1
      start_day: 1
      end_year: 2100
      end_month: 12
      end_day: 31
    area_statistics:
      operator: mean

  preproc_shape:
    custom_order: True
    extract_region:
      start_longitude: -123.0
      end_longitude: -119.0
      start_latitude: 45.0
      end_latitude: 52.0
    anomalies:
      period: full
      reference:
        start_year: 1950
        start_month: 1
        start_day: 1
        end_year: 1979
        end_month: 12
        end_day: 31
    extract_time:
      start_year: 1991
      start_month: 1
      start_day: 1
      end_year: 2020
      end_month: 12
      end_day: 31
    area_statistics:
      operator: mean


datasets_txx: &datasets_txx
  - { dataset: HadEX3, project: OBS, frequency: yr, tier: 2, mip: yr, type: clim, version: v20200928}

