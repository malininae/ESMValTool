diagnostics:
  hist_hist_nat:
    description: Figure for BC extremes
    variables:
      obs:
        short_name: txx
        start_year: 1950
        end_year: 2017
        preprocessor: preproc_shape
        additional_datasets: *datasets_txx
      all:
        short_name: tasmax
        start_year: 1950
        end_year: 2020
        project: CMIP6
        preprocessor: preproc_max
        additional_datasets: *datasets_hist
      ssp245: 
        short_name: tasmax
        start_year: 1950
        end_year: 2100
        project: CMIP6
        preprocessor: preproc_max
        additional_datasets: *datasets_hist        
      nat: 
        short_name: tasmax
        start_year: 1950
        end_year: 2020
        project: CMIP6
        preprocessor: preproc_max
        additional_datasets: *datasets_nat
    scripts:
      xcbox32:
        script: extreme_events/extremes_bc_txx_pdfs_mock.py
        mpl_style: ipcc_ar6_fgd
        reference_period: [1950, 1979]
        plotting_period: [1991, 2020]
        era_plotting_period: [1991, 2021]
        era_regridding_shape: false
        era_regridding_region: [-123.0,-119.0, 45.0, 52.0]
        region: BC 
        ax_var_label: Temperature
        title_var_label: TXx
        un_label: C
  
