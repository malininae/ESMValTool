diagnostics:
  wind:
    description: Figure for NA wind storms
    variables:
      wind_now:
        short_name: sfcWindmax
        exp: [highresSST-present, highresSST-future]
        start_year: 2011
        end_year: 2030
        project: CMIP6
        mip: day
        preprocessor: preproc_wsx
        additional_datasets: *datasets_highresmip      
      wind_nat: 
        short_name: sfcWindmax
        exp: highresSST-present
        start_year: 1950
        end_year: 1969
        project: CMIP6
        mip: day
        preprocessor: preproc_wsx
        additional_datasets: *datasets_highresmip
      wind_fut: 
        short_name: sfcWindmax
        exp: highresSST-future
        start_year: 2015
        end_year: 2050
        project: CMIP6
        mip: day
        preprocessor: preproc_wsx
        additional_datasets: *datasets_highresmip
      gst:
        short_name: tas
        exp: [highresSST-present, highresSST-future]
        start_year: 1950
        end_year: 2050
        project: CMIP6
        mip: Amon
        preprocessor: preproc_gst
        additional_datasets: *datasets_highresmip
      nast:
        short_name: tas
        exp: [highresSST-present, highresSST-future]
        start_year: 1950
        end_year: 2050
        project: CMIP6
        mip: Amon
        preprocessor: preproc_nast
        additional_datasets: *datasets_highresmip
    scripts:
      xcbox32:
        script: extreme_events/extremes_wind.py
        mpl_style: ipcc_ar6_fgd
        reference_period: [1950, 1969]
        era_fname_pattern: maximum_2m_temperature_since_previous_post_processing # era is processed from diagnostic, era stored in aux_dir
        era_regridding_shape: true # determines if needs shapefile or region
        era_regridding_region: atlantic_canada_no_labrador.shp # region to extract from era, either rectang coords or shape file name
        fit_distribution: GEV # which distribution to fit, gev or gumbel
        model_weighting: False # determines, if each realisation gets a weight of 1 (false) or 1/number of relisation
        name_all: 2011-2030 # this is needed for legend, it's name_{name of a group}
        name_nat: 1950-1969 
        name_ssp245: 2081-2100
        region: Atlantic Canada # needed for the figure title
        season: JJASON
        ax_var_label: windspeed # needed for axis name
        title_var_label: windspeed # needed for title name
        var_units: km/h 
        analysis_year: 2022

