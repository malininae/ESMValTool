# ESMValTool
# recipe_extremes_wind_fiona.yml
---
documentation:

  title: 2022 Atlantic Canada storm

  description: This is a recipe for analysing 2022 Atlantic Canada storm Fiona. 

  authors:
    - malinina_elizaveta

preprocessors:
  preproc_wsx: 
    custom_order: True
    extract_season:
      season: JJASON
    extract_shape:
      shapefile: atlantic_canada_no_labrador.shp
      method: contains
      crop: True
    area_statistics:
      operator: max
    annual_statistics:
      operator: max

  preproc_gst: 
    custom_order: True
    area_statistics:
      operator: mean
    annual_statistics:
      operator: mean
    anomalies:  
      period: full
      reference:
        start_year: 1950
        start_month: 1
        start_day: 1
        end_year: 1969
        end_month: 12
        end_day: 31

  preproc_nast: 
    custom_order: True
    extract_shape:
      shapefile: atlantic_canada_no_labrador.shp
      method: contains
      crop: True
    area_statistics:
      operator: mean
    annual_statistics:
      operator: mean
    anomalies:  
      period: full
      reference:
        start_year: 1950
        start_month: 1
        start_day: 1
        end_year: 1969
        end_month: 12
        end_day: 31
    

