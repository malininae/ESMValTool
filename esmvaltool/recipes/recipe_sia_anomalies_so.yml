# ESMValTool
# recipe_sia_anomalies_so.yml
---
documentation:

  title: Assessment of the SIA varibility in the SO.

  description: This is a recipe for analysing SIA anomlies in the SO.

  authors:
    - malinina_elizaveta

preprocessors: 
  preproc_cmip:
    custom_order: True
    regrid:
      target_grid: 1x1
      lon_offset: True
      lat_offset: True
      scheme: nearest
    extract_region:
      start_longitude: -180.
      end_longitude: 180.
      start_latitude: -90
      end_latitude: -50

  preproc_obs:
    anomalies:
      period: month
      reference: 
        start_year: 1979
        start_month: 1
        start_day: 1
        end_year: 2019
        end_month: 12
        end_day: 31

cmip6_list: &cmip6_list
#  - {dataset: ACCESS-CM2, institute: CSIRO-ARCCSS, grid: gn, ensemble: r1i1p1f1}
 - {dataset: BCC-CSM2-MR, grid: gn, ensemble: r1i1p1f1}
 - {dataset: CanESM5, grid: gn, ensemble: "r(1:25)i1p1f1"}
 - {dataset: CanESM5, grid: gn, ensemble: "r(1:25)i1p2f1"}
 - {dataset: CAMS-CSM1-0, grid: gn, ensemble: "r(1:2)i1p1f1"}
 - {dataset: CMCC-CM2-SR5, grid: gn, ensemble: r1i1p1f1}
 - {dataset: CMCC-ESM2, grid: gn, ensemble: r1i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: "r(1:2)i1p1f1"}
 - {dataset: EC-Earth3, grid: gn, ensemble: r4i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: r6i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: r9i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: "r(11:22)i1p1f1"}
  - {dataset: EC-Earth3, grid: gn, ensemble: r24i1p1f1}
 - {dataset: FGOALS-f3-L, grid: gn, ensemble: r1i1p1f1}
 - {dataset: FGOALS-g3, grid: gn, ensemble: "r(1:4)i1p1f1"}
 - {dataset: MPI-ESM1-2-HR, grid: gn, ensemble: r1i1p1f1}
 - {dataset: TaiESM1, grid: gn, ensemble: r1i1p1f1}

    
obs: &obs
  - {dataset: UHH-OSISAF, project: OBS, mip: OImon, tier: 2, type: clim, version: v2021}
  - {dataset: UHH-Bootstrap, project: OBS, mip: OImon, tier: 2, type: clim, version: v2021}
  - {dataset: UHH-NASATeam, project: OBS, mip: OImon, tier: 2, type: clim, version: v2021}

diagnostics: 
  sia_ano_so:
    description: calculates sia, its anomalies and creates plot
    variables: 
      cmip_sia:
        short_name: siconc
        preprocessor: preproc_cmip
        mip: SImon
        project: CMIP6
        exp: ['historical', 'ssp245']
        start_year: 1979
        end_year: 2021
        additional_datasets: *cmip6_list
      obs_sia: 
        short_name: siareas
        start_year: 1979
        end_year: 2019
        additional_datasets: *obs
    
    scripts: 
      script: seaice/sia_ano_so.py
      mpl_style: ipcc_ar6_fgd
      months: [2,6,9,12]
      ref_period: [1979, 2000]

