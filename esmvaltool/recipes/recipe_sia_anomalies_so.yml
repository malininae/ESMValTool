# ESMValTool
# recipe_sia_anomalies_so.yml
---
documentation:

  title: Assessment of the SIA varibility in the SO.

  description: This is a recipe for analysing SIA anomlies in the SO.

  authors:
    - malinina_elizaveta

preprocessors: 
  preproc_cmip:
    custom_order: True
    regrid:
      target_grid: 1x1
      lon_offset: True
      lat_offset: True
      scheme: nearest
    extract_region:
      start_longitude: -180.
      end_longitude: 180.
      start_latitude: -90
      end_latitude: -50
    extract_season:
      season: DJF

  preproc_obs:
    custom_order: True
    extract_season:
      season: DJF
    anomalies:
      period: season
      reference: 
        start_year: 1979
        start_month: 1
        start_day: 1
        end_year: 2019
        end_month: 12
        end_day: 31


cmip6_list: &cmip6_list
#  - {dataset: ACCESS-CM2, institute: CSIRO-ARCCSS, grid: gn, ensemble: r1i1p1f1}
 - {dataset: CanESM5, grid: gn, ensemble: "r(1:25)i1p1f1"}
 - {dataset: CanESM5, grid: gn, ensemble: "r(1:25)i1p2f1"}
 - {dataset: CAMS-CSM1-0, grid: gn, ensemble: "r(1:2)i1p1f1"}
 - {dataset: CESM2, grid: gn, ensemble: "r(1:3)i1p1f1"}
 - {dataset: CMCC-CM2-SR5, grid: gn, ensemble: r1i1p1f1}
 - {dataset: CMCC-ESM2, grid: gn, ensemble: r1i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: "r(1:2)i1p1f1"}
#  - {dataset: EC-Earth3, grid: gn, ensemble: r4i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: r6i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: r9i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: "r(11:17)i1p1f1"}
 - {dataset: EC-Earth3, grid: gn, ensemble: "r(19:20)i1p1f1"}
#  - {dataset: EC-Earth3, grid: gn, ensemble: r22i1p1f1}
 - {dataset: EC-Earth3, grid: gn, ensemble: r24i1p1f1}
 - {dataset: EC-Earth3-Veg, grid: gn, ensemble: r2i1p1f1}
 - {dataset: EC-Earth3-Veg, grid: gn, ensemble: r4i1p1f1}
 - {dataset: FGOALS-g3, grid: gn, ensemble: r1i1p1f1}
 - {dataset: GFDL-CM4, grid: gn, ensemble: r1i1p1f1}
 - {dataset: GFDL-ESM4, grid: gn, ensemble: r1i1p1f1}
 - {dataset: HadGEM3-GC31-LL, grid: gn, ensemble: "r(1:4)i1p1f3"}
 - {dataset: INM-CM4-8, grid: gr1, ensemble: r1i1p1f1}
 - {dataset: INM-CM5-0, grid: gr1, ensemble: r1i1p1f1}
 - {dataset: IPSL-CM6A-LR, grid: gn, ensemble: "r(1:4)i1p1f1"}
 - {dataset: IPSL-CM6A-LR, grid: gn, ensemble: r6i1p1f1}
 - {dataset: IPSL-CM6A-LR, grid: gn, ensemble: "r(10:11)i1p1f1"}
 - {dataset: IPSL-CM6A-LR, grid: gn, ensemble: r14i1p1f1}
 - {dataset: IPSL-CM6A-LR, grid: gn, ensemble: r22i1p1f1}
 - {dataset: IPSL-CM6A-LR, grid: gn, ensemble: r25i1p1f1}
 - {dataset: MIROC6, grid: gn, ensemble: "r(1:3)i1p1f1"}
 - {dataset: MIROC-ES2L, grid: gn, ensemble: r1i1p1f2}
 - {dataset: MPI-ESM1-2-HR, grid: gn, ensemble: r1i1p1f1}
 - {dataset: MPI-ESM1-2-LR, grid: gn, ensemble: r1i1p1f1}
 - {dataset: MRI-ESM2-0, grid: gn, ensemble: "r(2:5)i1p1f1"}
 - {dataset: NorESM2-LM, grid: gn, ensemble: "r(2:3)i1p1f1"}
 - {dataset: UKESM1-0-LL, grid: gn, ensemble: "r(1:4)i1p1f2"}
 - {dataset: UKESM1-0-LL, grid: gn, ensemble: r8i1p1f2}
    
obs: &obs
  - {dataset: UHH-OSISAF, project: OBS, mip: OImon, tier: 2, type: clim, version: v2021}
  - {dataset: UHH-Bootstrap, project: OBS, mip: OImon, tier: 2, type: clim, version: v2021}
  - {dataset: UHH-NASATeam, project: OBS, mip: OImon, tier: 2, type: clim, version: v2021}

diagnostics: 
  sia_ano_so:
    description: calculates sia, its anomalies and creates plot
    variables: 
      cmip_sia:
        short_name: siconc
        preprocessor: preproc_cmip
        mip: SImon
        project: CMIP6
        exp: ['historical', 'ssp245']
        start_year: 1979
        end_year: 2020
        additional_datasets: *cmip6_list
      obs_sia: 
        short_name: siareas
        preprocessor: preproc_obs
        start_year: 1979
        end_year: 2019
        additional_datasets: *obs
    
    scripts: 
      sia_ano:
        script: seaice/sia_ano_so.py
        mpl_style: ipcc_ar6_fgd
        ref_period: [1850, 1900]

