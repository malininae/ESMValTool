  - {dataset: UHH-OSISAF, tier: 2, type: clim, version: v2021}
  - {dataset: UHH-Bootstrap, tier: 2, type: clim, version: v2021}
  - {dataset: UHH-NASATeam, tier: 2, type: clim, version: v2021}

diagnostics: 
  sia_ano_so:
    description: calculates sia, its anomalies and creates plot
    variables: 
      cmip_hist_sia:
        short_name: siconc
        preprocessor: preproc_cmip
        mip: SImon
        project: CMIP6
        exp: [ 'historical', 'ssp245']
        start_year: 1984
        start_month: 12
        start_day: 1 
        end_year: 2094
        additional_datasets: *cmip6_list
      cmip_pic_sia:
        short_name: siconc
        preprocessor: preproc_cmip
        mip: SImon
        project: CMIP6
        exp: piControl
        start_month: 12
        start_day: 1 
        additional_datasets: *cmip6_picontrol_list
      obs_sia: 
        short_name: siareas
        preprocessor: preproc_obs
        project: OBS
        mip: OImon
        start_year: 1984
        start_month: 12
        start_day: 1 
        end_year: 2014
        additional_datasets: *obs
    
    scripts: 
      sia_ano:
        script: seaice/sia_ano_so.py
        mpl_style: ipcc_ar6_fgd_large
        ref_period_len: 20
        n_year_std: 10
        obs_time_range: [1985, 2014]
        cmip6_time_range: [1985, 2094]
