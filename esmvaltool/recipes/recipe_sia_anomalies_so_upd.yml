# ESMValTool
# recipe_sia_anomalies_so.yml
---
documentation:

  title: Assessment of the SIA varibility in the SO.

  description: This is a recipe for analysing SIA anomlies in the SO.

  authors:
    - malinina_elizaveta

preprocessors: 
  preproc_cmip:
    custom_order: True
    extract_season:
      season: DJF
    regrid:
      target_grid: 1x1
      lon_offset: True
      lat_offset: True
      scheme: nearest
    extract_region:
      start_longitude: 0.
      end_longitude: 360.
      start_latitude: -90
      end_latitude: -50


  preproc_obs:
    custom_order: True
    extract_season:
      season: DJF
    seasonal_statistics:
      operator: mean 
      seasons: ['DJF']
    # anomalies:
    #   period: season
    #   reference: 
    #     start_year: 1985
    #     start_month: 1
    #     start_day: 1
    #     end_year: 2004
    #     end_month: 12
    #     end_day: 31


