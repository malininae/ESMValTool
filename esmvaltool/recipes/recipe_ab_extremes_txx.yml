# ESMValTool
# recipe_bc_extremes_txx.yml
---
documentation:

  title: GEVs 2021 BC heatwave

  description: This is a recipe for analysing 2021 BC heat wave.

  authors:
    - malinina_elizaveta

preprocessors:
  preproc_txx: &prep_txx
    custom_order: True
    regrid:
      target_grid: 0.5x0.5
      lon_offset: 0.25
      lat_offset: 0.25
      scheme: linear    
    extract_shape:
      shapefile: alberta.shp
      method: contains
      crop: True
    area_statistics:
      operator: mean
    annual_statistics:
      operator: max
    anomalies:
      period: full
      reference:
        start_year: 1940
        start_month: 1
        start_day: 1
        end_year: 1959
        end_month: 12
        end_day: 31    

  preproc_txx_nat: 
    <<: *prep_txx
    extract_time:
      start_year: 1850
      start_month: 1
      start_day: 1
      end_year: 1900
      end_month: 12
      end_day: 31

  preproc_txx_all: 
    <<: *prep_txx
    extract_time:
      start_year: 2011
      start_month: 1
      start_day: 1
      end_year: 2030
      end_month: 12
      end_day: 31

  preproc_txx_fut: 
    <<: *prep_txx
    extract_time:
      start_year: 2081
      start_month: 1
      start_day: 1
      end_year: 2100
      end_month: 12
      end_day: 31

  preproc_era_abs: &prep_era_abs
    custom_order: True 
    extract_shape:
      shapefile: alberta.shp
      method: contains
      crop: True
    area_statistics:
      operator: mean
    annual_statistics:
      operator: max

  preproc_era_ano: 
    <<: *prep_era_abs   
    anomalies:
      period: full
      reference:
        start_year: 1940
        start_month: 1
        start_day: 1
        end_year: 1959
        end_month: 12
        end_day: 31   

  preproc_gsat:
    custom_order: True  
    area_statistics:
      operator: mean    
    annual_statistics:
      operator: mean

