  - {dataset: ACCESS-ESM1-5, ensemble: "r(35:40)i1p1f1", grid: gn}
  - {dataset: ACCESS-CM2, ensemble: "r(1:5)i1p1f1", grid: gn}
  - {dataset: AWI-CM-1-1-MR, ensemble: r1i1p1f1, grid: gn}
