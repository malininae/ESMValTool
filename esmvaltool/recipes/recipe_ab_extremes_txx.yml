dataset_era: &dataset_era
  - {dataset: ERA5, project: OBS6, type: reanaly, version: '1', tier: 3}

dataset_hadcrut: &dataset_hadcrut
  - {dataset: HadCRUT5, project: OBS, mip: Amon, tier: 2, type: ground, version: 5.0.1.0-analysis}

diagnostics:
  xcbox32:
    description: Figure for BC extremes
    variables:
      all:
        short_name: tasmax
        exp: [historical, ssp245]
        start_year: 1940
        end_year: 2030
        project: CMIP6
        mip: day
        preprocessor: preproc_txx_all
        additional_datasets: *datasets_tasmax
      ssp245: 
        short_name: tasmax
        exp: [historical, ssp245]
        start_year: 1940
        end_year: 2100
        project: CMIP6
        mip: day
        preprocessor: preproc_txx_fut
        additional_datasets: *datasets_tasmax        
      nat: 
        short_name: tasmax
        exp: historical
        start_year: 1850
        end_year: 1959
        project: CMIP6
        mip: day
        preprocessor: preproc_txx_nat
        additional_datasets: *datasets_tasmax
      obs_abs:
        short_name: tasmax
        start_year: 1940
        end_year: 2022
        mip: day
        preprocessor: preproc_era_abs 
        additional_datasets: *dataset_era        
      obs_ano:
        short_name: tasmax
        start_year: 1940
        end_year: 2022
        mip: day
        preprocessor: preproc_era_ano 
        additional_datasets: *dataset_era      
      obs_gsat:
        short_name: tasa
        start_year: 1940
        end_year: 2022
        mip: Amon
        preprocessor: preproc_gsat 
        additional_datasets: *dataset_hadcrut         
    scripts:
      xcbox32:
        script: extreme_events/extremes_bc_temperature.py
        mpl_style: ipcc_ar6_fgd
        reference_period: [1940, 1959]
        fit_distribution: GEV # which distribution to fit, gev or gumbel
        model_weighting: False # determines, if each realisation gets a weight of 1 (false) or 1/number of relisation
        name_all: 2011-2030 # this is needed for legend, it's name_{name of a group}
        name_nat: 1850-1900 
        name_ssp245: 2081-2100
        region: Alberta # needed for the figure title
        ax_var_label: TXx # needed for axis name
        title_var_label: TXx # needed for title name
        var_units: C 
        analysis_year: 2021
        smooth_gsat_years: 4

