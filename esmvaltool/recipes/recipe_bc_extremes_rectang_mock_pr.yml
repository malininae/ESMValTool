datasets_nat: &datasets_nat
  - {dataset: ACCESS-ESM1-5, ensemble: r1i1p1f1, mip: day, grid: gn}
  - {dataset: ACCESS-CM2, ensemble: r1i1p1f1, mip: day, grid: gn}
  - {dataset: BCC-CSM2-MR, ensemble: r1i1p1f1, mip: day, grid: gn}
  - {dataset: CanESM5, ensemble: "r(1:2)i1p1f1", mip: day, grid: gn}
  - {dataset: CNRM-CM6-1, ensemble: r1i1p1f2, mip: day, grid: gr}
#  - {dataset: FGOALS-g3, ensemble: "r(1:2)i1p1f1", mip: day, grid: gn}
  - {dataset: GFDL-ESM4, institute: NOAA-GFDL, ensemble: r1i1p1f1, mip: day, grid: gr1}
  - {dataset: HadGEM3-GC31-LL, ensemble: r1i1p1f3, mip: day, grid: gn}
  - {dataset: IPSL-CM6A-LR, ensemble: "r(1:2)i1p1f1", mip: day, grid: gr}
  - { dataset: MIROC6, ensemble: "r(1:2)i1p1f1", mip: day, grid: gn }
  - {dataset: MRI-ESM2-0, ensemble: r1i1p1f1, mip: day, grid: gn}
  - {dataset: NorESM2-LM, ensemble: r1i1p1f1, mip: day, grid: gn}

diagnostics:
  hist_hist_nat:
    description: Figure for BC extremes
    variables:
      all:
        short_name: pr
        exp: [historical, ssp245]
        start_year: 2011
        end_year: 2030
        project: CMIP6
        preprocessor: preproc_sum
        additional_datasets: *datasets_hist_extended
      ssp245: 
        short_name: pr
        exp: [historical, ssp245]
        start_year: 2081
        end_year: 2100
        project: CMIP6
        preprocessor: preproc_sum
        additional_datasets: *datasets_hist_extended        
      nat: 
        short_name: pr
        exp: historical
        start_year: 1950
        end_year: 1969
        project: CMIP6
        preprocessor: preproc_sum
        additional_datasets: *datasets_hist_extended
      anomaly:
        short_name: pr
        exp: historical
        start_year: 1950
        end_year: 1969
        project: CMIP6
        preprocessor: preproc_anomalies
        additional_datasets: *datasets_hist_extended
    scripts:
      hist_hist_nat:
        script: extreme_events/extremes_bc_txx_pdfs_mock.py
        mpl_style: ipcc_ar6_fgd
        reference_period: [1950, 1969]
        plotting_period: [2011, 2030]
        era_fname_pattern: total_precipitation
        era_plotting_period: [2000, 2021]
        era_regridding_shape: false
        era_regridding_region: [-125.0,-120.5, 48.25, 50.25]
        mult_factor: 84600
        n_days: 3
        region: BC 
        ax_var_label: Precipitation
        title_var_label: Rx3day
        un_label: mm