# ESMValTool
# recipe_bc_extremes_rectang.yml
---
documentation:
  description: This is a recipe for analysing 2021 BC heat wave.

  authors:
    - malinina_elizaveta

preprocessors:
  preproc_sum:
    custom_order: True
    regrid:
      target_grid: 0.5x0.5
      lon_offset: 0.25
      scheme: linear
    extract_region:
      start_longitude: -125.0
      end_longitude: -120.5
      start_latitude: 48.25
      end_latitude: 50.25
    area_statistics:
      operator: mean

  preproc_anomalies:
    custom_order: True
    regrid:
      target_grid: 0.5x0.5
      lon_offset: 0.25
      scheme: linear
    extract_region:
      start_longitude: -125.0
      end_longitude: -120.5
      start_latitude: 48.25
      end_latitude: 50.25
    area_statistics:
      operator: mean


datasets_hist: &datasets_hist
