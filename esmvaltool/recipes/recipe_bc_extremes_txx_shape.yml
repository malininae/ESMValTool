diagnostics:
  xcbox32:
    description: Figure for BC extremes
    variables:
      all:
        short_name: tasmax
        exp: [historical, ssp245]
        start_year: 2011
        end_year: 2030
        project: CMIP6
        preprocessor: preproc_txx
        additional_datasets: *datasets_tasmax
      ssp245: 
        short_name: tasmax
        exp: ssp245
        start_year: 2081
        end_year: 2100
        project: CMIP6
        preprocessor: preproc_txx
        additional_datasets: *datasets_tasmax        
      nat: 
        short_name: tasmax
        exp: historical
        start_year: 1850
        end_year: 1900
        project: CMIP6
        preprocessor: preproc_txx
        additional_datasets: *datasets_tasmax
      anomaly:
        short_name: tasmax
        exp: historical
        start_year: 1950
        end_year: 1969
        project: CMIP6
        preprocessor: preproc_txx
        additional_datasets: *datasets_tasmax
    scripts:
      xcbox32:
        script: extreme_events/extremes_bc_temperature.py
        mpl_style: ipcc_ar6_fgd
        reference_period: [1950, 1969]
        era_fname_pattern: maximum_2m_temperature_since_previous_post_processing # era is processed from diagnostic, era stored in aux_dir
        era_regridding_shape: true # determines if needs shapefile or region
        era_regridding_region: 'british_columbia.shp' # region to extract from era, either rectang coords or shape file name
        fit_distribution: GEV # which distribution to fit, gev or gumbel
        model_weighting: False # determines, if each realisation gets a weight of 1 (false) or 1/number of relisation
        name_all: 2011-2030 # this is needed for legend, it's name_{name of a group}
        name_nat: 1850-1900 
        name_ssp245: 2081-2100
        region: BC # needed for the figure title
        ax_var_label: TX3x # needed for axis name
        title_var_label: TX3x # needed for title name
        n_days: 3 # for nuber of the days to be averaged for TxNx
        var_units: C 
        analysis_year: 2021

