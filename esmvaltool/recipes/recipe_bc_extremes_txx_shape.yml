# ESMValTool
# recipe_bc_extremes_txx.yml
---
documentation:

  title: GEVs 2021 BC heatwave

  description: This is a recipe for analysing 2021 BC heat wave.

  authors:
    - malinina_elizaveta

preprocessors:
  preproc_txx:
    custom_order: True
    regrid:
      target_grid: 0.5x0.5
      lon_offset: 0.25
      lat_offset: 0.25
      scheme: linear    
    extract_shape:
      shapefile: 'british_columbia.shp'
      method: 'contains'
      crop: True
    area_statistics:
      operator: mean

datasets_tasmax: &datasets_tasmax
  - {dataset: ACCESS-ESM1-5, ensemble: "r(1:18)i1p1f1", mip: day, grid: gn}
